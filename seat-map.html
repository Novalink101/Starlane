 if(ptrs.size==1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){cam.yaw-=dx*.005;cam.pit=Math.max(.25,Math.min(1.5,cam.pit+dy*.004));go()}}
 else if(ptrs.size==2){const n=d2();cam.dist*=pd0/n;pd0=n;clampD();moved=99;go()}});
const up=e=>{const was=ptrs.size==1&&moved<=5;ptrs.delete(e.pointerId);
 if(was&&e.type=='pointerup'){const s=hit(e.clientX,e.clientY);if(s&&!s.isT&&!s.cap){lastSeat=s;renderRn()}if(s&&!s.sold)toggle(s);else if(s)toast(s.lab+' is sold')}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=e.deltaY>0?1.08:.93;clampD();go()},{passive:false});
function tween(to){const f={...cam},t0=performance.now(),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function st(t){const k=still?1:Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);for(const q in to)cam[q]=f[q]+(to[q]-f[q])*e;frame();if(k<1)requestAnimationFrame(st)})(t0)}
const tog=a=>{$('v3').className=a?'on':'';$('v2').className=a?'':'on'};
$('zi').onclick=()=>{cam.dist*=.8;clampD();go()};$('zo').onclick=()=>{cam.dist*=1.25;clampD();go()};
$('rs').onclick=()=>{fit();tog(1);go()};
$('v3').onclick=()=>{tween({pit:.52,yaw:0});tog(1)};$('v2').onclick=()=>{tween({pit:1.5,yaw:0});tog(0)};
$('go').onclick=()=>toast('Checkout is the next step');
$('pa').onclick=()=>{const c=$('pc').value.trim(),p=V.promos.find(q=>q.code.toUpperCase()==c.toUpperCase());if(!p){promo='';toast(c?'That promo code is not valid':'Enter a promo code');upd();return}promo=p.code;upd();toast('Code '+p.code+' applies to '+(p.sec=='*'?'all sections':p.sec))};
$('pc').addEventListener('keydown',e=>{if(e.key=='Enter')$('pa').click()});
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-ga]');if(b)gaAdd(V.zones.find(z=>z.id==b.dataset.ga),+b.dataset.d)});
addEventListener('resize',rs);rs();if(W<820)dz.classList.add('hid');load('stadium',1);
</script></body></html>
